<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>For My Mama ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 30%, #5d123d 0%, #260819 45%, #0d030b 100%);
    color: white;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}

/* Floating hearts */

.heart {
    position: fixed;
    font-size: 22px;
    opacity: 0.5;
    animation: floatHeart 7s linear infinite;
    z-index: 1;
    pointer-events: none;
}

.heart:nth-child(1) {
    left: 8%;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 25%;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 60%;
    animation-delay: 4s;
}

.heart:nth-child(4) {
    left: 85%;
    animation-delay: 1s;
}

@keyframes floatHeart {

    0% {
        bottom: -50px;
        transform: translateX(0) rotate(0deg);
    }

    100% {
        bottom: 110%;
        transform: translateX(50px) rotate(360deg);
    }
}

/* Main container */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 2;
}

/* Small heading */

.subtitle {
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 7px;
    color: #ff82b0;
    margin-top: 10px;
    margin-bottom: 25px;
}

/* Main title */

h1 {
    text-align: center;
    color: #ff70a5;
    font-size: clamp(42px, 7vw, 78px);
    line-height: 1.05;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(255, 80, 150, 0.3);
}

/* Big heart */

.big-heart {
    text-align: center;
    font-size: 65px;
    margin-bottom: 35px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}

/* Music button */

.music-button {
    position: fixed;
    top: 25px;
    right: 25px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 1px solid #9f638b;
    background: rgba(20, 0, 15, 0.7);
    color: #b986ff;
    font-size: 25px;
    cursor: pointer;
    z-index: 100;
}

.music-button:hover {
    transform: scale(1.08);
}

/* Photo frame */

.photo-frame {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 8px;
    border-radius: 30px;
    background: linear-gradient(135deg, #e95b9b, #ffb4d0);
    box-shadow: 0 0 30px rgba(255, 80, 150, 0.35);
}

/* Image */

.photo-frame img {
    display: block;
    width: 100%;
    height: auto;
    min-height: 300px;
    max-height: 700px;
    object-fit: contain;
    background: #000;
    border-radius: 22px;
}

/* Caption */

.caption {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-top: 12px;
    margin-bottom: 30px;
    color: white;
}

/* Gallery */

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 40px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid #df5d96;
    background: #000;
    transition: transform 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.04);
}

/* Message */

.message {
    max-width: 750px;
    margin: 50px auto 0;
    padding: 30px;
    border-radius: 25px;
    background: rgba(80, 10, 50, 0.35);
    border: 1px solid rgba(255, 120, 180, 0.3);
    text-align: center;
    line-height: 1.8;
    font-size: 19px;
}

.message h2 {
    color: #ff78a9;
    margin-bottom: 15px;
}

/* Mobile */

@media (max-width: 700px) {

    .container {
        padding: 30px 12px 60px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 4px;
        margin-bottom: 18px;
    }

    h1 {
        font-size: 40px;
        padding: 0 5px;
    }

    .big-heart {
        font-size: 50px;
        margin-bottom: 25px;
    }

    .music-button {
        width: 48px;
        height: 48px;
        top: 15px;
        right: 15px;
        font-size: 21px;
    }

    .photo-frame {
        padding: 6px;
        border-radius: 20px;
    }

    .photo-frame img {
        min-height: 220px;
        max-height: 500px;
        border-radius: 15px;
    }

    .caption {
        font-size: 17px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 25px;
    }

    .gallery img {
        border-radius: 12px;
        border-width: 2px;
    }

    .message {
        margin-top: 35px;
        padding: 20px 15px;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<!-- Floating hearts -->

<div class="heart">❤️</div>
<div class="heart">💗</div>
<div class="heart">💕</div>
<div class="heart">❤️</div>

<!-- Music -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="./song.mp3" type="audio/mpeg">
</audio>

<button
    class="music-button"
    id="musicButton"
    onclick="toggleMusic()"
    aria-label="Play music">
    🎵
</button>

<div class="container">

    <div class="subtitle">
        NAMMA NINAIVU 01
    </div>

    <h1>
        Andha Azhagana Moment
    </h1>

    <div class="big-heart">
        ❤️
    </div>

    <!-- Main photo -->

    <div class="photo-frame">

        <img
            src="./photo%201.jpg"
            alt="Namma Ninaivu"
            onerror="this.style.display='none';">

    </div>

    <div class="caption">
        Namma Ninaivu ❤️
    </div>

    <!-- Photo gallery -->

    <div class="gallery">

        <img src="./photo%201.jpg" alt="Memory 1">

        <img src="./photo%202.jpg" alt="Memory 2">

        <img src="./photo%203.jpg" alt="Memory 3">

        <img src="./photo%204.jpg" alt="Memory 4">

        <img src="./photo%205.jpg" alt="Memory 5">

        <img src="./photo%206.jpg" alt="Memory 6">

        <img src="./photo%207.jpg" alt="Memory 7">

        <img src="./photo%208.jpg" alt="Memory 8">

        <img src="./photo%209.jpg" alt="Memory 9">

        <img src="./photo%2010.jpg" alt="Memory 10">

        <img src="./photo%2011.jpg" alt="Memory 11">

        <img src="./photo%2012.jpg" alt="Memory 12">

        <img src="./photo%2013.jpg" alt="Memory 13">

        <img src="./photo%2014.jpg" alt="Memory 14">

        <img src="./photo%2015.jpg" alt="Memory 15">

    </div>

    <div class="message">

        <h2>For My Mama ❤️</h2>

        <p>
            Some memories are too beautiful to forget.
            <br>
            You are one of those beautiful memories.
            <br><br>
            Thank you for being a special part of my life. ❤️
        </p>

    </div>

</div>

<script>

const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

function toggleMusic() {

    if (music.paused) {

        music.play()
            .then(function() {
                musicButton.innerHTML = "🔊";
            })
            .catch(function() {
                alert("Please tap the music button again to play the song.");
            });

    } else {

        music.pause();
        musicButton.innerHTML = "🎵";

    }
}

</script>

</body>
</html>
